[project]
name = "auris-reader"
version = "0.1.0"
description = "Offline audiobook reader with local TTS, character-aware voices and synced highlighting"
requires-python = ">=3.10"
dependencies = [
    # Kokoro TTS engine (default)
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    # OmniVoice TTS engine and what it runs on
    "omnivoice>=0.1.5",
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers==5.3.0",      # OmniVoice loads correctly with 5.3.0; newer 5.x builds can break
    "accelerate>=1.13.0",
    "gradio>=6.0",
    "tensorboardX>=2.6",
    "webdataset>=1.0",
    "numpy>=2.0",
    "soundfile>=0.12",
    "librosa>=0.11",
    "pydub>=0.25",              # MP3 export (also needs ffmpeg on PATH)
    # The app
    "flask>=3.0",
    "ebooklib>=0.18",
    "pymupdf>=1.24",            # imported as: import pymupdf
    "spacy>=3.7",
    "en-core-web-sm",           # spaCy's English model (character detection); see [tool.uv.sources]
]

# Which PyTorch build to install. With neither extra, PyPI's own build is used (Apple Silicon: MPS;
# Windows: CPU; Linux: CUDA). For a specific one:  uv sync --extra cpu   or   uv sync --extra cu128
[project.optional-dependencies]
cpu = ["torch", "torchaudio"]
cu128 = ["torch", "torchaudio"]     # NVIDIA, CUDA 12.8

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",   # browser tests; then: uv run playwright install chromium
    "ruff>=0.17.5",
]

[tool.uv]
package = false                 # an application run from this folder, not an installable package
default-groups = ["dev"]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
extend-exclude = [".dev", "data", "uploads", "exports", "audio_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E701", "E702",     # `if x: return` and `a; b` one-liners are this codebase's style
    "E731",             # a lambda bound to a name is fine for small helpers
    "B905",             # zip() without strict=
    "UP031",            # %-formatting in tests
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]                 # some imports follow setup code on purpose
"core/enrichment.py" = ["E501"]     # long word lists
"core/exporter.py" = ["E501"]
